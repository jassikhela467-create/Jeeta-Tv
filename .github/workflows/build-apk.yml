name: Build Jeeta TV V2 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Jeeta TV V2 source
        run: |
          unzip -q jeetatv-source-V2.zip -d jeeta-source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Jeeta TV V2 APK
        working-directory: jeeta-source
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JeetaTV-V2-debug-apk
          path: jeeta-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
