name: Build Jeeta TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract final Jeeta TV package
        run: |
          unzip -q JeetaTV_FINAL_PHONE_PACKAGE.zip -d package
          unzip -q package/jeetatv-source.zip -d jeeta-source

      - name: Enable Android Compose
        working-directory: jeeta-source
        run: |
          awk '1; /compileSdk = 35/{print ""; print "    buildFeatures {"; print "        compose = true"; print "    }"}' app/build.gradle.kts > app/build.gradle.kts.tmp
          mv app/build.gradle.kts.tmp app/build.gradle.kts

      - name: Verify project
        working-directory: jeeta-source
        run: |
          echo "Checking Jeeta TV project..."
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          echo "Project found:"
          find app/src/main -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Jeeta TV debug APK
        working-directory: jeeta-source
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JeetaTV-debug-apk
          path: jeeta-source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
