name: Build Jeeta TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Jeeta TV source
        run: | unzip -q jeetatv-source.zip -d jeeta-source echo "Project files:" find jeeta-source -maxdepth 3 -type f | sort | head -100 
      - name: Fix Java and Kotlin JVM targets
        working-directory: jeeta-source
        run: | sed -i '/compileSdk = 35/a\ compileOptions {\n sourceCompatibility = JavaVersion.VERSION_17\n targetCompatibility = JavaVersion.VERSION_17\n }\n kotlinOptions {\n jvmTarget = "17"\n }' app/build.gradle.kts echo "Updated app/build.gradle.kts:" sed -n '1,45p' app/build.gradle.kts 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: jeeta-source
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JeetaTV-debug-apk
          path: jeeta-source/app/build/outputs/apk/debug/*.apk
